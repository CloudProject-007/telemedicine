# Local development dependencies. Run the API itself with `npm run dev` in ./backend.
#   docker compose up -d            -> postgres + minio (S3-compatible)
#   docker compose --profile realtime up -d   -> also redis (Socket.IO adapter)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telemed
      POSTGRES_PASSWORD: telemed
      POSTGRES_DB: telemedicine
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telemed -d telemedicine']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/telemedicine-medical-files;
      mc anonymous set none local/telemedicine-medical-files;
      "

  redis:
    image: redis:7-alpine
    profiles: ['realtime']
    ports:
      - '6379:6379'

volumes:
  pgdata:
  miniodata:
